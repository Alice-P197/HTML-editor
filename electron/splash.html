<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .stage {
    position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden;
    background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 55%, #134e4a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
  }
  /* 细网格纹理 */
  .grid {
    position: absolute; inset: 0; opacity: .14;
    background-image:
      linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(circle at 50% 45%, #000 30%, transparent 75%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .5; }
  .glow.a { width: 230px; height: 230px; background: #6366f1; top: -70px; left: -55px; animation: float 5s ease-in-out infinite; }
  .glow.b { width: 210px; height: 210px; background: #2dd4bf; bottom: -70px; right: -45px; animation: float 5s ease-in-out infinite reverse; }
  @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(26px, 20px); } }

  /* logo 外围旋转光环 */
  .ring {
    position: absolute; width: 108px; height: 108px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, #2dd4bf 20%, #6366f1 45%, transparent 65%);
    animation: spin 3.2s linear infinite; opacity: .7;
    -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%, #000 72%, transparent 74%);
    mask: radial-gradient(circle, transparent 58%, #000 60%, #000 72%, transparent 74%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap { position: relative; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }
  .logo {
    position: relative; width: 76px; height: 76px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(135deg, #5865f2, #2dd4bf);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 30px;
    box-shadow: 0 12px 32px rgba(99, 102, 241, .45), inset 0 1px 0 rgba(255, 255, 255, .25);
    animation: breathe 2.2s ease-in-out infinite;
  }
  /* logo 高光斜扫 */
  .logo::after {
    content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.45), transparent);
    animation: sweep 2.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 12px 32px rgba(99, 102, 241, .45); }
    50% { transform: scale(1.06); box-shadow: 0 16px 40px rgba(45, 212, 191, .5); }
  }
  @keyframes sweep { 0% { left: -80%; } 55%, 100% { left: 130%; } }

  .title { color: #f8fafc; font-size: 22px; font-weight: 600; letter-spacing: .5px; animation: rise .7s ease-out both; }
  .sub { color: #94a3b8; font-size: 13px; letter-spacing: 2px; animation: rise .7s .12s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .bar { width: 180px; height: 3px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; animation: rise .7s .22s ease-out both; }
  .bar i {
    display: block; height: 100%; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, #5865f2, #2dd4bf);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(450%); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="logo">&lt;/&gt;</div>
    </div>
    <div class="title">HTML 编辑器</div>
    <div class="sub">实时源码 · 所见即所得</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
